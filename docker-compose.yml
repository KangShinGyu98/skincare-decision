# Local development infrastructure for Skincare Decision MVP.
services:
  postgres:
    image: postgres:16-alpine
    container_name: skincare-decision-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: skincare_decision
      POSTGRES_PASSWORD: skincare_decision
      POSTGRES_DB: skincare_decision
      TZ: UTC
    volumes:
      - skincare_decision_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skincare_decision -d skincare_decision"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: skincare-decision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - skincare_decision_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skincare_decision_postgres_data:
  skincare_decision_redis_data:
