# Local infrastructure for the backend development database and cache.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: skincare_decision
      POSTGRES_PASSWORD: skincare_decision
      POSTGRES_DB: skincare_decision
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  pg_data:
