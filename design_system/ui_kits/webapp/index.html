<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Beauty Decision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Roboto','Noto Sans KR','PingFang SC',sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
:root {
  --blue-1: #e6f7ff; --blue-5: #40a9ff; --blue-6: #1890ff; --blue-7: #096dd9;
  --green-1: #f6ffed; --green-6: #52c41a;
  --gold-1: #fffbe6; --gold-6: #faad14;
  --red-1: #fff1f0; --red-5: #ff4d4f;
  --gray-3: #f5f5f5; --gray-4: #f0f0f0; --gray-5: #d9d9d9;
  --gray-6: #bfbfbf; --gray-7: #8c8c8c; --gray-8: #595959; --gray-10: #262626;
  --page-bg: #f0f2f5;
  --radius: 2px;
  --transition: 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
}
/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 3px; }
/* Animations */
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.fade-in { animation: fadeIn 0.25s ease forwards; }
@keyframes tagScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.tag-scroll-inner { display: flex; gap: 10px; animation: tagScroll 18s linear infinite; white-space: nowrap; }
.tag-scroll-inner:hover { animation-play-state: paused; }
.tag-scroll-wrap { overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ──────────────── DESIGN TOKENS ──────────────── */
const T = {
  primary: '#1890ff', primaryHover: '#40a9ff', primaryActive: '#096dd9',
  primaryLight: '#e6f7ff', success: '#52c41a', successLight: '#f6ffed',
  warning: '#faad14', warningLight: '#fffbe6',
  error: '#ff4d4f', errorLight: '#fff1f0',
  textPrimary: '#262626', textSecondary: '#595959', textTertiary: '#8c8c8c',
  textDisabled: '#bfbfbf', textInverse: '#ffffff',
  border: '#d9d9d9', borderLight: '#f0f0f0',
  bgPage: '#f0f2f5', bgWhite: '#ffffff', bgComponent: '#fafafa',
  bgDark: '#001529', shadow2: '0 2px 8px rgba(0,0,0,0.15)',
};

/* ──────────────── SHARED COMPONENTS ──────────────── */
function Btn({ children, type='default', size='md', onClick, style={}, disabled=false }) {
  const base = {
    display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6,
    borderRadius:2, fontFamily:'inherit', cursor: disabled ? 'not-allowed' : 'pointer',
    border:'1px solid transparent', transition:'all 0.3s', fontWeight:400,
    ...(size === 'sm' ? { height:24, padding:'1px 7px', fontSize:12 } :
        size === 'lg' ? { height:40, padding:'6px 24px', fontSize:16 } :
        { height:32, padding:'4px 15px', fontSize:14 }),
  };
  const variants = {
    primary:  { background: disabled ? '#f5f5f5' : T.primary,  borderColor: disabled ? '#d9d9d9' : T.primary,  color: disabled ? T.textDisabled : '#fff', boxShadow:'0 2px 0 rgba(0,0,0,.016)' },
    default:  { background: '#fff', borderColor: T.border, color: disabled ? T.textDisabled : T.textPrimary, boxShadow:'0 2px 0 rgba(0,0,0,.016)' },
    dashed:   { background: '#fff', borderStyle:'dashed', borderColor: T.border, color: T.textPrimary },
    text:     { background:'transparent', borderColor:'transparent', color: T.primary },
    danger:   { background: T.error, borderColor: T.error, color:'#fff', boxShadow:'0 2px 0 rgba(0,0,0,.016)' },
    ghost:    { background:'transparent', borderColor:'#fff', color:'#fff' },
  };
  return <button style={{...base, ...variants[type], ...style}} onClick={!disabled ? onClick : undefined}>{children}</button>;
}

function Tag({ children, color='default', style={} }) {
  const variants = {
    default: { bg:'#fafafa', border:'#d9d9d9', text: T.textPrimary },
    blue:    { bg:'#e6f7ff', border:'#91d5ff', text:'#096dd9' },
    green:   { bg:'#f6ffed', border:'#b7eb8f', text:'#389e0d' },
    red:     { bg:'#fff1f0', border:'#ffa39e', text:'#cf1322' },
    gold:    { bg:'#fffbe6', border:'#ffe58f', text:'#d48806' },
    purple:  { bg:'#f9f0ff', border:'#d3adf7', text:'#531dab' },
    cyan:    { bg:'#e6fffb', border:'#87e8de', text:'#08979c' },
    selected:{ bg: T.primary, border: T.primary, text:'#fff' },
  };
  const v = variants[color] || variants.default;
  return <span style={{ display:'inline-flex', alignItems:'center', borderRadius:2, fontSize:12, padding:'2px 8px', lineHeight:'20px', border:`1px solid ${v.border}`, background:v.bg, color:v.text, ...style }}>{children}</span>;
}

function Alert({ type='info', title, desc }) {
  const cfg = {
    success: { icon:'✓', bg:'#f6ffed', border:'#b7eb8f', iconColor:'#52c41a' },
    info:    { icon:'ℹ', bg:'#e6f7ff', border:'#91d5ff', iconColor:'#1890ff' },
    warning: { icon:'△', bg:'#fffbe6', border:'#ffe58f', iconColor:'#faad14' },
    error:   { icon:'✕', bg:'#fff1f0', border:'#ffa39e', iconColor:'#ff4d4f' },
  };
  const c = cfg[type];
  return (
    <div style={{ display:'flex', gap:8, padding:'10px 12px', borderRadius:2, border:`1px solid ${c.border}`, background:c.bg }}>
      <span style={{ color:c.iconColor, fontWeight:700, flexShrink:0, marginTop:1 }}>{c.icon}</span>
      <div>
        {title && <div style={{ fontSize:14, fontWeight:500, color:T.textPrimary, marginBottom:2 }}>{title}</div>}
        {desc && <div style={{ fontSize:13, color:T.textSecondary, lineHeight:1.6, wordBreak:'keep-all' }}>{desc}</div>}
      </div>
    </div>
  );
}

function Card({ title, extra, children, style={} }) {
  return (
    <div style={{ background:'#fff', border:`1px solid ${T.border}`, borderRadius:2, ...style }}>
      {title && (
        <div style={{ padding:'12px 16px', borderBottom:`1px solid ${T.borderLight}`, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <span style={{ fontSize:16, fontWeight:500, color:T.textPrimary }}>{title}</span>
          {extra && <span style={{ fontSize:14, color:T.primary, cursor:'pointer' }}>{extra}</span>}
        </div>
      )}
      <div style={{ padding:'14px 16px' }}>{children}</div>
    </div>
  );
}

function TopNav({ onNav }) {
  const [scrolled, setScrolled] = useState(false);
  return (
    <div style={{ position:'sticky', top:0, zIndex:100, background: T.bgDark, height:48, display:'flex', alignItems:'center', padding:'0 24px', gap:24, boxShadow: T.shadow2 }}>
      <div style={{ color:'#fff', fontSize:16, fontWeight:700, letterSpacing:'0.01em', cursor:'pointer' }} onClick={() => onNav('landing')}>
        K-Beauty Decision
      </div>
      <div style={{ display:'flex', gap:16, marginLeft:8 }}>
        {[['priority','Priority Gate'],['matrix','Product Matrix'],['traceback','Traceback']].map(([key, label]) => (
          <span key={key} onClick={() => onNav(key)} style={{ color:'rgba(255,255,255,0.65)', fontSize:14, cursor:'pointer', padding:'0 4px' }}>{label}</span>
        ))}
      </div>
      <div style={{ marginLeft:'auto' }}>
        <Btn type="primary" size="sm" onClick={() => onNav('priority')}>시작하기</Btn>
      </div>
    </div>
  );
}

function Steps({ current, items }) {
  return (
    <div style={{ background:'#fff', borderBottom:`1px solid ${T.borderLight}`, padding:'14px 24px', display:'flex', alignItems:'center' }}>
      {items.map((item, i) => (
        <React.Fragment key={i}>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <div style={{
              width:24, height:24, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:12, fontWeight:500, flexShrink:0,
              background: i < current ? T.primary : i === current ? '#fff' : '#fff',
              border: i < current ? `2px solid ${T.primary}` : i === current ? `2px solid ${T.primary}` : `2px solid ${T.border}`,
              color: i < current ? '#fff' : i === current ? T.primary : T.textTertiary,
            }}>
              {i < current ? '✓' : i + 1}
            </div>
            <span style={{ fontSize:14, fontWeight: i === current ? 500 : 400, color: i < current ? T.primary : i === current ? T.textPrimary : T.textTertiary }}>
              {item}
            </span>
          </div>
          {i < items.length - 1 && <div style={{ flex:1, height:1, background: i < current ? T.primary : T.border, margin:'0 8px', minWidth:20 }} />}
        </React.Fragment>
      ))}
    </div>
  );
}

function FilterTag({ label, on, onClick }) {
  return (
    <span onClick={onClick} style={{
      display:'inline-flex', alignItems:'center', gap:4, borderRadius:100,
      fontSize:13, padding:'4px 12px', border:`1px solid ${on ? T.primary : T.border}`,
      background: on ? '#e6f7ff' : '#fff', color: on ? T.primary : T.textSecondary,
      fontWeight: on ? 500 : 400, cursor:'pointer', transition:'all 0.2s', userSelect:'none',
    }}>{on && <span style={{ fontSize:10 }}>✓</span>}{label}</span>
  );
}

function FitBadge({ fit }) {
  const cfg = {
    pass:    { icon:'✓', label:'적합', bg:'#f6ffed', color:'#52c41a' },
    caution: { icon:'△', label:'주의', bg:'#fffbe6', color:'#d48806' },
    fail:    { icon:'✕', label:'비추', bg:'#fff1f0', color:'#ff4d4f' },
  };
  const c = cfg[fit];
  return <span style={{ display:'inline-flex', alignItems:'center', gap:3, borderRadius:2, fontSize:12, padding:'2px 8px', fontWeight:500, background:c.bg, color:c.color }}>{c.icon} {c.label}</span>;
}

/* ──────────────── LANDING PAGE ──────────────── */
const CONCERN_ROWS = [
  { label:'일회성 트러블', tags:['뾰루지','여드름','붉어짐','뒤집힘','트러블 반복','민감 반응','뾰루지','여드름','붉어짐','뒤집힘','트러블 반복','민감 반응'] },
  { label:'일상 불편',    tags:['건조','당김','각질','번들거림','눈가 건조','입술 트임','건조','당김','각질','번들거림','눈가 건조','입술 트임'] },
  { label:'화장 / 꾸미기', tags:['화장 뜸','밀림','쿠션 추천','파운데이션 고민','선크림 추천','립 제품','화장 뜸','밀림','쿠션 추천','파운데이션 고민','선크림 추천','립 제품'] },
  { label:'컴플렉스',     tags:['잡티','다크서클','홍조','모공','피부톤','탄력','잡티','다크서클','홍조','모공','피부톤','탄력'] },
];

const SEGMENTS = [
  { key:'A', title:'어디서부터 손댈지 모름', desc:'지금 무엇부터 정리해야 할지 모르는 상태', icon:'?' },
  { key:'B', title:'고민은 있는데 카테고리를 모름', desc:'문제는 있지만 어떤 제품군이 필요한지 모름', icon:'💭' },
  { key:'C', title:'이미 찾는 제품군이 있음', desc:'선크림, 세럼 등 보고 싶은 제품군이 있음', icon:'→' },
  { key:'D', title:'실패 원인 추적형', desc:'특정 제품 사용 후 피부 반응이 있었던 경우', icon:'⚗' },
];

function Landing({ onNav }) {
  return (
    <div className="fade-in">
      {/* Hero */}
      <div style={{ background:'#fff', padding:'60px 24px 48px', textAlign:'center', borderBottom:`1px solid ${T.borderLight}` }}>
        <div style={{ maxWidth:600, margin:'0 auto' }}>
          <div style={{ fontSize:11, fontWeight:700, color:T.primary, letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:16 }}>스킨케어 결정 서비스</div>
          <h1 style={{ fontSize:38, fontWeight:700, color:T.textPrimary, lineHeight:1.2, marginBottom:16, wordBreak:'keep-all' }}>고민부터 시작해도 돼요</h1>
          <p style={{ fontSize:16, color:T.textSecondary, lineHeight:1.7, marginBottom:32, wordBreak:'keep-all' }}>
            어떤 제품이 필요한지 몰라도 괜찮아요.<br/>
            지금 상태와 고민에 맞춰 필요한 카테고리로 이어드립니다.
          </p>
          <div style={{ display:'flex', gap:10, justifyContent:'center', flexWrap:'wrap' }}>
            <Btn type="primary" size="lg" onClick={() => onNav('priority')}>시작하기</Btn>
            <Btn type="default" size="lg" onClick={() => onNav('matrix')}>제품 바로 보기</Btn>
          </div>
        </div>
      </div>

      {/* Segment Selection */}
      <div style={{ maxWidth:800, margin:'0 auto', padding:'40px 24px' }}>
        <h2 style={{ fontSize:20, fontWeight:500, color:T.textPrimary, marginBottom:8, textAlign:'center', wordBreak:'keep-all' }}>어디서 시작할까요?</h2>
        <p style={{ fontSize:14, color:T.textSecondary, textAlign:'center', marginBottom:24 }}>지금 상황에 맞는 시작점을 고르세요</p>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
          {SEGMENTS.map(s => (
            <div key={s.key} onClick={() => onNav(s.key === 'D' ? 'traceback' : 'priority')}
              style={{ background:'#fff', border:`1px solid ${T.border}`, borderRadius:2, padding:20, cursor:'pointer', transition:'all 0.2s' }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = T.primary; e.currentTarget.style.boxShadow = '0 2px 8px rgba(24,144,255,0.15)'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = T.border; e.currentTarget.style.boxShadow = 'none'; }}>
              <div style={{ fontSize:22, marginBottom:8 }}>{s.icon}</div>
              <div style={{ fontSize:15, fontWeight:500, color:T.textPrimary, marginBottom:4, wordBreak:'keep-all' }}>{s.title}</div>
              <div style={{ fontSize:13, color:T.textSecondary, wordBreak:'keep-all', lineHeight:1.6 }}>{s.desc}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Concern Carousel */}
      <div style={{ background:'#fff', borderTop:`1px solid ${T.borderLight}`, borderBottom:`1px solid ${T.borderLight}`, padding:'40px 0' }}>
        <div style={{ textAlign:'center', marginBottom:24, padding:'0 24px' }}>
          <h2 style={{ fontSize:20, fontWeight:500, color:T.textPrimary, marginBottom:8, wordBreak:'keep-all' }}>고민 유형으로 시작하기</h2>
          <p style={{ fontSize:14, color:T.textSecondary }}>고민 태그를 클릭하면 카테고리로 이어드립니다</p>
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          {CONCERN_ROWS.map((row, ri) => (
            <div key={ri}>
              <div style={{ fontSize:11, fontWeight:700, color:T.textTertiary, letterSpacing:'0.05em', textTransform:'uppercase', padding:'0 24px', marginBottom:6 }}>{row.label}</div>
              <div className="tag-scroll-wrap" style={{ padding:'4px 0' }}>
                <div className="tag-scroll-inner" style={{ animationDuration: `${18 + ri * 3}s`, animationDirection: ri % 2 === 0 ? 'normal' : 'reverse', paddingLeft:24 }}>
                  {row.tags.map((tag, ti) => (
                    <span key={ti} onClick={() => onNav('matrix')}
                      style={{ display:'inline-block', padding:'6px 14px', border:`1px solid ${T.border}`, borderRadius:100, fontSize:13, color:T.textSecondary, background:'#fff', cursor:'pointer', flexShrink:0, whiteSpace:'nowrap', transition:'all 0.2s' }}
                      onMouseEnter={e => { e.currentTarget.style.borderColor = T.primary; e.currentTarget.style.color = T.primary; e.currentTarget.style.background = '#e6f7ff'; }}
                      onMouseLeave={e => { e.currentTarget.style.borderColor = T.border; e.currentTarget.style.color = T.textSecondary; e.currentTarget.style.background = '#fff'; }}>
                      {tag}
                    </span>
                  ))}
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Fast Lane categories */}
      <div style={{ maxWidth:800, margin:'0 auto', padding:'40px 24px' }}>
        <h2 style={{ fontSize:20, fontWeight:500, color:T.textPrimary, marginBottom:8, textAlign:'center' }}>빠른 제품군 선택</h2>
        <p style={{ fontSize:14, color:T.textSecondary, textAlign:'center', marginBottom:20 }}>이미 찾는 제품군이 있다면 바로 시작하세요</p>
        <div style={{ display:'flex', gap:10, flexWrap:'wrap', justifyContent:'center' }}>
          {['선크림','세럼','립케어','로션 / 크림','클렌저','앰플','에센스','토너패드'].map(cat => (
            <Btn key={cat} type="default" onClick={() => onNav('matrix')}>{cat}</Btn>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ──────────────── PRIORITY GATE ──────────────── */
const LIFE_CHECKS = [
  { key:'irritation', q:'최근 7일 안에 따가움, 붉어짐, 가려움이 반복됐나요?' },
  { key:'new_products', q:'최근 2주 안에 새 제품을 2개 이상 추가했나요?' },
  { key:'outdoor', q:'낮에 밖에 있는 시간이 많은 편인가요?' },
  { key:'sunscreen', q:'선크림을 거의 매일 바르나요?' },
  { key:'cleansing', q:'선크림/메이크업 후 클렌징이 잘 되고 있나요?' },
  { key:'dry', q:'세안 후 당김, 건조, 따가움이 자주 있나요?' },
  { key:'moisturizer', q:'보습제를 매일 꾸준히 사용하나요?' },
  { key:'makeup', q:'베이스 메이크업을 자주 하나요?' },
];
const PRODUCT_CATS = ['클렌징 오일/밤/워터','폼클렌저/젤클렌저','토너','스킨','에센스','세럼','앰플','로션','크림','선크림','각질제거제','레티놀 제품','비타민C 제품','AHA/BHA 제품','마스크팩','립케어'];

function PriorityGate({ onNav }) {
  const [checks, setChecks] = useState({});
  const [products, setProducts] = useState({});
  const [result, setResult] = useState(null);

  const toggle = (key, map, setMap) => setMap(prev => ({ ...prev, [key]: !prev[key] }));

  const evaluate = () => {
    if (checks.irritation || checks.new_products) {
      setResult({ type:'hold', title:'지금은 새 제품보다 피부 반응 안정화가 먼저예요.', desc:'최근 자극이 있거나 루틴 변경이 많아 지금은 새 제품보다 현재 루틴을 7~14일 고정하는 것이 좋습니다.' });
    } else if (checks.outdoor && !checks.sunscreen) {
      setResult({ type:'caution', title:'선크림 루틴이 먼저예요.', desc:'야외 활동이 많은데 선크림이 안정화되지 않았어요. 매일 쓸 수 있는 선크림을 먼저 찾아야 합니다.' });
    } else if (checks.dry && !checks.moisturizer) {
      setResult({ type:'caution', title:'기능성 제품보다 보습 루틴 고정이 먼저예요.', desc:'세안 후 당김이 반복된다면 수분 세럼보다 매일 쓸 수 있는 로션/크림이 먼저입니다.' });
    } else {
      setResult({ type:'pass', title:'지금은 기능성 제품군을 봐도 괜찮아요.', desc:'기본 루틴이 안정되어 있고 최근 자극이 없어 새 제품을 탐색해도 됩니다.' });
    }
  };

  return (
    <div className="fade-in">

/* ──────────────── APP SHELL ──────────────── */
function App() {
  const [screen, setScreen] = useState('landing');

  const screenMap = {
    landing:   <Landing onNav={setScreen} />,
    priority:  <PriorityGate onNav={setScreen} />,
    category:  <CategoryDecision onNav={setScreen} />,
    matrix:    <ProductMatrix onNav={setScreen} />,
    traceback: <ReactionTraceback onNav={setScreen} />,
  };

  return (
    <div style={{ minHeight:'100vh', background: T.bgPage }}>
      <TopNav onNav={setScreen} />
      {screenMap[screen] || screenMap.landing}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
