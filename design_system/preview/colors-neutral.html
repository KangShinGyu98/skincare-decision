<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Roboto', sans-serif;
        background: #fff;
        padding: 20px;
      }
      .row {
        display: flex;
        gap: 0;
        margin-bottom: 12px;
      }
      .swatch {
        flex: 1;
        height: 52px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 4px 6px;
      }
      .swatch span {
        font-size: 10px;
        font-weight: 500;
      }
      .label {
        font-size: 11px;
        font-weight: 700;
        color: #262626;
        margin-bottom: 6px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .usage-row {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .usage-chip {
        border-radius: 2px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid #d9d9d9;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="label">Neutral Gray Scale</div>
    <div class="row">
      <div class="swatch" style="background: #ffffff; border: 1px solid #f0f0f0">
        <span style="color: #8c8c8c">1</span>
      </div>
      <div class="swatch" style="background: #fafafa; border: 1px solid #f0f0f0">
        <span style="color: #8c8c8c">2</span>
      </div>
      <div class="swatch" style="background: #f5f5f5"><span style="color: #8c8c8c">3</span></div>
      <div class="swatch" style="background: #f0f0f0"><span style="color: #595959">4</span></div>
      <div class="swatch" style="background: #d9d9d9"><span style="color: #595959">5</span></div>
      <div class="swatch" style="background: #bfbfbf"><span style="color: #595959">6</span></div>
      <div class="swatch" style="background: #8c8c8c"><span style="color: #fff">7</span></div>
      <div class="swatch" style="background: #595959"><span style="color: #fff">8</span></div>
      <div class="swatch" style="background: #434343"><span style="color: #fff">9</span></div>
      <div class="swatch" style="background: #262626"><span style="color: #fff">10</span></div>
      <div class="swatch" style="background: #1f1f1f"><span style="color: #fff">11</span></div>
      <div class="swatch" style="background: #141414"><span style="color: #fff">12</span></div>
      <div class="swatch" style="background: #000000"><span style="color: #fff">13</span></div>
    </div>

    <div class="label" style="margin-top: 16px">Text Hierarchy</div>
    <div class="usage-row">
      <div class="usage-chip">
        <div class="dot" style="background: #262626"></div>
        Primary #262626
      </div>
      <div class="usage-chip">
        <div class="dot" style="background: #595959"></div>
        Secondary #595959
      </div>
      <div class="usage-chip">
        <div class="dot" style="background: #8c8c8c"></div>
        Tertiary #8c8c8c
      </div>
      <div class="usage-chip">
        <div class="dot" style="background: #bfbfbf"></div>
        Disabled #bfbfbf
      </div>
      <div class="usage-chip">
        <div class="dot" style="background: #ffffff; border: 1px solid #d9d9d9"></div>
        Inverse #fff
      </div>
    </div>

    <div class="label">Background Hierarchy</div>
    <div class="usage-row">
      <div class="usage-chip">
        <div class="dot" style="background: #f0f2f5; border: 1px solid #d9d9d9"></div>
        Page #f0f2f5
      </div>
      <div class="usage-chip">
        <div class="dot" style="background: #fafafa; border: 1px solid #d9d9d9"></div>
        Component #fafafa
      </div>
      <div class="usage-chip">
        <div class="dot" style="background: #ffffff; border: 1px solid #d9d9d9"></div>
        Card #ffffff
      </div>
      <div class="usage-chip">
        <div class="dot" style="background: #001529"></div>
        Dark Nav #001529
      </div>
    </div>
  </body>
</html>
