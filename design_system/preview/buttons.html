<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Roboto','Noto Sans KR',sans-serif; background: #fff; padding: 20px; }
  .label { font-size: 11px; font-weight: 700; color: #262626; margin-bottom: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .sublabel { font-size: 10px; color: #8c8c8c; margin-bottom: 4px; }
  .section { margin-bottom: 16px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 2px; font-family: inherit; font-size: 14px; font-weight: 400; cursor: pointer; padding: 4px 15px; height: 32px; line-height: 1; transition: all 0.3s; border: 1px solid transparent; }
  .btn-sm { height: 24px; padding: 1px 7px; font-size: 12px; }
  .btn-lg { height: 40px; padding: 6px 24px; font-size: 16px; }

  .btn-primary { background: #1890ff; border-color: #1890ff; color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.016); }
  .btn-default { background: #fff; border-color: #d9d9d9; color: #262626; box-shadow: 0 2px 0 rgba(0,0,0,.016); }
  .btn-dashed  { background: #fff; border: 1px dashed #d9d9d9; color: #262626; }
  .btn-text    { background: transparent; border-color: transparent; color: #262626; }
  .btn-link    { background: transparent; border-color: transparent; color: #1890ff; }
  .btn-danger  { background: #ff4d4f; border-color: #ff4d4f; color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.016); }
  .btn-ghost   { background: transparent; border-color: #fff; color: #fff; }
  .btn-disabled { background: #f5f5f5; border-color: #d9d9d9; color: #bfbfbf; cursor: not-allowed; }

  .dark-bg { background: #001529; padding: 10px; border-radius: 2px; display: flex; gap: 10px; align-items: center; }
  .section-divider { border: none; border-top: 1px solid #f0f0f0; margin: 12px 0; }
</style>
</head>
<body>
  <div class="label">Buttons — Ant Design</div>

  <div class="section">
    <div class="sublabel">Types</div>
    <div class="row">
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-default">Default</button>
      <button class="btn btn-dashed">Dashed</button>
      <button class="btn btn-text">Text</button>
      <button class="btn btn-link">Link</button>
      <button class="btn btn-danger">Danger</button>
      <button class="btn btn-disabled" disabled>Disabled</button>
    </div>
  </div>

  <div class="section">
    <div class="sublabel">Sizes</div>
    <div class="row">
      <button class="btn btn-primary btn-sm">Small</button>
      <button class="btn btn-primary">Default (32px)</button>
      <button class="btn btn-primary btn-lg">Large</button>
    </div>
  </div>

  <div class="section">
    <div class="sublabel">Ghost (dark bg)</div>
    <div class="dark-bg">
      <button class="btn btn-ghost">Ghost</button>
      <button class="btn btn-primary" style="background:transparent;border-color:#40a9ff;color:#40a9ff;">Ghost Primary</button>
    </div>
  </div>

  <hr class="section-divider">
  <div class="section">
    <div class="sublabel">Skincare Decision Product Actions</div>
    <div class="row">
      <button class="btn btn-primary">지금 시작하기</button>
      <button class="btn btn-default">선크림 보러가기 →</button>
      <button class="btn btn-dashed">+ 문제 상품 추가</button>
      <button class="btn btn-text" style="color:#1890ff;">필터 초기화</button>
    </div>
  </div>
</body></html>
